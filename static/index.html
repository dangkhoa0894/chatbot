<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TechShop AI</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="chat-root">

  <!-- Header -->
  <header class="chat-header">
    <div class="header-brand">
      <div class="bot-logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z" fill="rgba(255,255,255,0.25)"/>
          <path d="M8 9.5C8 8.12 9.12 7 10.5 7S13 8.12 13 9.5 11.88 12 10.5 12 8 10.88 8 9.5zM12.5 15.5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5S16.38 18 15 18s-2.5-1.12-2.5-2.5z" fill="white" opacity="0.9"/>
          <path d="M10.5 12v1.5M13 9.5h2" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
        </svg>
      </div>
      <span class="header-title">TechShop AI</span>
    </div>
    <div class="header-actions">
      <span class="session-id" id="session-label"></span>
      <button class="hdr-btn" onclick="clearSession()" title="Cuộc trò chuyện mới">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Connection banner -->
  <div class="conn-banner" id="conn-banner"></div>

  <!-- Messages -->
  <main class="messages-area" id="chat-messages">
    <div class="welcome-wrap" id="welcome-state">
      <div class="welcome-avatar">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
          <path d="M8 9.5C8 8.12 9.12 7 10.5 7S13 8.12 13 9.5 11.88 12 10.5 12 8 10.88 8 9.5zM12.5 15.5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5S16.38 18 15 18s-2.5-1.12-2.5-2.5z" fill="white" opacity="0.95"/>
          <path d="M10.5 12v1.5M13 9.5h2" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>
        </svg>
      </div>
      <h1 class="welcome-title">TechShop AI</h1>
      <p class="welcome-sub">Tư vấn mua sắm điện tử thông minh</p>
    </div>
  </main>

  <!-- Input area -->
  <footer class="input-footer">
    <div class="input-shell">
      <textarea
        id="msg-input"
        placeholder="Nhắn tin với TechShop AI..."
        rows="1"
        autocomplete="off"
      ></textarea>
      <div class="input-bottom-row">
        <div class="input-left-actions"><!-- future: attach, etc. --></div>
        <button id="send-btn" disabled title="Gửi">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M12 19V5M5 12l7-7 7 7" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>
    <p class="footer-disclaimer">TechShop AI có thể mắc lỗi. Kiểm tra thông tin trước khi quyết định mua hàng.</p>
  </footer>

</div>

<script src="/static/app.js"></script>
</body>
</html>
