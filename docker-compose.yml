version: "3.9"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  chatbot:
    build: .
    ports:
      - "${PORT:-8290}:8290"
    volumes:
      - chatbot_data:/app/data
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-change_me_in_production_min_32_chars}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8290}
      - SESSION_MAX_ENTRIES=5000
      - WORKERS=1
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8290/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  landing:
    build: ./landing
    ports:
      - "${LANDING_PORT:-8291}:80"
    restart: unless-stopped

volumes:
  redis_data:
  chatbot_data:
